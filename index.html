<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JB Coaching Concepts — Apply</title>
<link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg:#F4F6F7;          /* clean clinical off-white */
    --bg-raise:#FFFFFF;
    --line:#DDE3E6;
    --ink:#16232B;         /* near-black slate */
    --ink-dim:#5E6E77;
    --teal:#0E8C8B;        /* clinical teal */
    --teal-lite:#12A3A1;
    --teal-deep:#0A6B6A;
    --amber:#E0A73B;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  #progress{
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:linear-gradient(90deg,var(--teal-deep),var(--teal-lite));
    transition:width .45s cubic-bezier(.4,0,.2,1);
    z-index:50;
  }

  #back{
    position:fixed; top:18px; left:20px; z-index:40;
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-dim); background:none; border:none;
    cursor:pointer; padding:8px; opacity:0; pointer-events:none;
    transition:opacity .3s, color .2s;
  }
  #back:hover{color:var(--ink);}
  #back.show{opacity:1; pointer-events:auto;}

  #stage{
    height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:80px 28px 40px;
    overflow-y:auto;
  }
  .panel{
    max-width:640px; width:100%;
    animation:rise .5s cubic-bezier(.16,.84,.44,1) both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(16px);}
    to{opacity:1; transform:translateY(0);}
  }

  .qnum{
    font-family:'JetBrains Mono',monospace;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--teal); margin-bottom:18px;
    display:flex; align-items:center; gap:10px;
  }
  .qnum::after{content:""; flex:1; height:1px; background:var(--line);}

  h1{
    font-family:'Archivo',sans-serif; font-weight:700;
    line-height:1.04; margin:0; letter-spacing:-.015em;
  }
  .q{
    font-family:'Archivo',sans-serif; font-weight:600;
    font-size:30px; line-height:1.18; margin:0 0 8px; letter-spacing:-.01em;
  }
  .qsub{ color:var(--ink-dim); font-size:15px; margin:0 0 26px; }

  .opts{display:flex; flex-direction:column; gap:11px;}
  .opt{
    display:flex; align-items:center; gap:14px;
    background:var(--bg-raise);
    border:1px solid var(--line);
    border-radius:10px;
    padding:15px 18px;
    cursor:pointer;
    font-size:16px; color:var(--ink);
    text-align:left; width:100%;
    transition:border-color .18s, background .18s, transform .12s, box-shadow .18s;
  }
  .opt:hover{ border-color:var(--teal); box-shadow:0 4px 16px rgba(14,140,139,.10); }
  .opt:active{ transform:scale(.99); }
  .opt.sel{ border-color:var(--teal); background:#E7F4F4; }
  .opt .badge{
    font-family:'JetBrains Mono',monospace;
    font-size:12px; font-weight:500;
    width:26px; height:26px; flex:0 0 26px;
    border:1px solid var(--line); border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-dim); transition:all .18s;
  }
  .opt:hover .badge, .opt.sel .badge{
    border-color:var(--teal); color:var(--teal); background:rgba(14,140,139,.1);
  }

  .field-in{
    width:100%; background:transparent;
    border:none; border-bottom:2px solid var(--line);
    color:var(--ink); font-family:'Inter',sans-serif;
    font-size:22px; padding:10px 2px; outline:none;
    transition:border-color .2s;
  }
  .field-in:focus{ border-color:var(--teal); }
  .field-in::placeholder{ color:#9aa6ac; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .phone-row{ display:flex; gap:10px; align-items:flex-end; }
  .flag{
    font-size:18px; border:1px solid var(--line); border-radius:9px;
    background:var(--bg-raise); color:var(--ink);
    padding:11px 12px; outline:none; font-family:'Inter',sans-serif;
  }

  .next{
    margin-top:26px; display:inline-flex; align-items:center; gap:10px;
    background:var(--teal); color:#F4FBFB;
    border:none; border-radius:9px;
    font-family:'Archivo',sans-serif; font-weight:600;
    font-size:15px; padding:13px 28px; cursor:pointer;
    transition:background .18s, transform .12s;
  }
  .next:hover{ background:var(--teal-deep); }
  .next:active{ transform:scale(.98); }
  .next:disabled{ background:#b8c4c8; color:#eef3f4; cursor:not-allowed; }
  .hint{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; color:var(--ink-dim); margin-top:14px; letter-spacing:.04em;
  }
  .hint b{ color:var(--ink); font-weight:500; }

  .welcome .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:12px;
    letter-spacing:.18em; text-transform:uppercase;
    color:var(--teal); margin:0 0 20px;
  }
  .welcome h1{ font-size:50px; margin-bottom:20px; }
  .welcome h1 span{ color:var(--teal); }
  .welcome .lead{ font-size:18px; color:#33424a; margin:0 0 14px; max-width:52ch; }
  .welcome .lead.dim{ color:var(--ink-dim); font-size:16px; }
  .creds{
    display:flex; gap:0; margin:30px 0 6px;
    border-top:1px solid var(--line);
  }
  .cred{ flex:1; padding:18px 16px 0 0; }
  .cred .n{ font-family:'Archivo',sans-serif; font-weight:700; font-size:26px; color:var(--teal-deep); }
  .cred .l{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim); margin-top:4px; }
  .sig{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); margin-top:26px; letter-spacing:.03em; }
  .sig b{ color:var(--ink); }

  .end{ text-align:left; }
  .end .mark{
    font-family:'JetBrains Mono',monospace; font-size:12px;
    letter-spacing:.14em; text-transform:uppercase; margin-bottom:20px;
  }
  .end.ok .mark{ color:var(--teal); }
  .end.dq .mark{ color:var(--ink-dim); }
  .end h1{ font-size:42px; margin-bottom:18px; }
  .end p{ font-size:16px; color:#33424a; margin:0 0 14px; max-width:50ch; }
  .end p.dim{ color:var(--ink-dim); }
  .bookbtn{
    margin-top:16px; display:inline-flex; align-items:center; gap:10px;
    background:var(--teal); color:#F4FBFB; text-decoration:none;
    border-radius:9px; font-family:'Archivo',sans-serif; font-weight:600;
    font-size:16px; padding:15px 32px; cursor:pointer; transition:background .18s, transform .12s;
  }
  .bookbtn:hover{ background:var(--teal-deep); }
  .bookbtn:active{ transform:scale(.98); }

  .restart{
    position:fixed; bottom:18px; right:20px;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase;
    color:#a7b2b7; background:none; border:none; cursor:pointer; z-index:40;
    transition:color .2s;
  }
  .restart:hover{ color:var(--ink-dim); }

  @media (max-width:560px){
    .welcome h1{ font-size:37px; }
    .q{ font-size:25px; }
    .grid2{ grid-template-columns:1fr; }
    .creds{ flex-wrap:wrap; }
    .cred{ flex:1 1 46%; }
  }
</style>
</head>
<body>
  <div id="progress"></div>
  <button id="back" onclick="goBack()">← Back</button>
  <div id="stage"></div>
  <button class="restart" onclick="restart()" style="display:none" id="restartBtn">↺ Restart demo</button>

<script>
/* ============================================================
   SETUP — replace with Jon's real Calendly link before launch
   ============================================================ */
const CALENDLY_URL = "https://calendly.com/jbcoachingconcepts/coaching-call";

/* A lead must NOT select one of these finance tiers to reach the calendar */
const FINANCE_DISQUALIFY = [
  'I have no source of income right now',
];

const answers = {};
let idx = 0;

const questions = [
  {
    id:'situation', num:'01', type:'choice',
    q:'Which of these sounds most like you right now?',
    sub:"We'll build the plan around your life.",
    options:[
      'Complete beginner to training',
      'Train sometimes, no real structure',
      'Consistent but stuck / plateaued',
      'Getting back after a long break',
      'Prepping for a specific goal or event',
    ]
  },
  {
    id:'finance', num:'02', type:'choice',
    q:'Which of these best describes your financial situation?',
    sub:'Be honest — this helps us understand how to best support you.',
    options:[
      'I have no source of income right now',
      "My income doesn't fully cover my day-to-day expenses",
      "I can pay my bills but don't save much after",
      'I can pay my bills and save a good amount each month',
      "I'm financially comfortable and living well",
    ]
  },
  {
    id:'invest_soft', num:'03', type:'choice',
    q:'When you find a coach who can actually get you the result — what are you ready to invest in yourself?',
    sub:'Real coaching is an investment, not an expense.',
    options:[
      'Under $1,500',
      '$1,500 – $2,500',
      '$2,500 – $4,000',
      '$4,000+',
      "I'd want to see the plan first",
    ]
  },
  {
    id:'physique', num:'04', type:'choice',
    q:'What do you want your physique to look and feel like?',
    sub:'Pick the outcome that matters most to you.',
    options:[
      'Lean & in shape — look good in a t-shirt',
      'Build noticeable muscle & size',
      'Athletic & performing at my best',
      'Full body recomposition — lean and muscular',
      'Stage-ready / competition condition',
    ]
  },
  {
    id:'why_coached', num:'05', type:'longtext',
    q:'Why do you believe working with Jon is what will finally get you the result?',
    sub:"Spots are limited — tell us why you'd make the most of one.",
    placeholder:"Be honest — what makes you ready, and why now?",
  },
  {
    id:'email', num:'06', type:'email',
    q:"What's the best email to reach you at?",
    sub:"We'll send your next steps here.",
  },
  {
    id:'contact', num:'07', type:'contact',
    q:'And your name and number?',
    sub:"So the team can reach out to lock in your call.",
  },
];

const stage = document.getElementById('stage');
const bar = document.getElementById('progress');
const backBtn = document.getElementById('back');
const restartBtn = document.getElementById('restartBtn');

function setProgress(){
  const total = questions.length + 1;
  const pct = Math.min(100, (idx/total) * 100);
  bar.style.width = pct + '%';
  backBtn.classList.toggle('show', idx>0 && idx<=questions.length);
}

function render(){
  setProgress();
  if(idx === 0){ renderWelcome(); return; }
  if(idx <= questions.length){ renderQuestion(questions[idx-1]); return; }
}

function renderWelcome(){
  restartBtn.style.display='none';
  stage.innerHTML = `
    <div class="panel welcome">
      <p class="eyebrow">JB Coaching Concepts · Application</p>
      <h1>Transform how you<br>look, feel &amp; <span>perform</span>.</h1>
      <p class="lead">Answer a few quick questions so we can understand your goals and see if we're the right fit to get you there.</p>
      <p class="lead dim">If it's a fit, we'll get you booked straight onto a call.</p>
      <p class="sig">— <b>Jon Ballard</b>, JB Coaching Concepts</p>
      <button class="next" onclick="next()">Start my application →</button>
      <p class="hint">Takes about 2 minutes · <b>7 questions</b></p>
    </div>`;
}

function renderQuestion(item){
  restartBtn.style.display='none';
  let inner = `<div class="qnum">Question ${item.num}</div>
    <p class="q">${item.q}</p>
    ${item.sub ? `<p class="qsub">${item.sub}</p>` : ''}`;

  if(item.type === 'choice'){
    inner += `<div class="opts">`;
    item.options.forEach((o,i)=>{
      const text = typeof o === 'string' ? o : o.label;
      const letter = String.fromCharCode(65+i);
      inner += `<button class="opt" onclick="pick('${item.id}', ${i})">
        <span class="badge">${letter}</span><span>${text}</span></button>`;
    });
    inner += `</div><p class="hint">Press <b>A–${String.fromCharCode(64+item.options.length)}</b> or click</p>`;
  }
  else if(item.type === 'longtext'){
    inner += `<textarea class="field-in" id="in_${item.id}" rows="4"
      placeholder="${item.placeholder||''}" oninput="validText('${item.id}')"
      style="border:1px solid var(--line); border-radius:10px; padding:14px; font-size:17px; min-height:130px; resize:none;">${answers[item.id]||''}</textarea>
      <br><button class="next" id="textNext" onclick="submitText('${item.id}')" disabled>Continue →</button>
      <p class="hint">A thoughtful answer moves you up the list · <b>Ctrl+Enter</b> to continue</p>`;
  }
  else if(item.type === 'email'){
    inner += `<input class="field-in" type="email" id="in_email" placeholder="you@email.com"
      value="${answers.email||''}" oninput="validEmail()" onkeydown="if(event.key==='Enter')submitEmail()">
      <br><button class="next" id="emailNext" onclick="submitEmail()" disabled>Continue →</button>
      <p class="hint">Press <b>Enter</b> to continue</p>`;
  }
  else if(item.type === 'contact'){
    inner += `<div class="grid2">
        <div><input class="field-in" id="in_first" placeholder="First name" value="${answers.first||''}" oninput="validContact()"></div>
        <div><input class="field-in" id="in_last" placeholder="Last name" value="${answers.last||''}" oninput="validContact()"></div>
      </div>
      <div class="phone-row" style="margin-top:22px;">
        <select class="flag" id="in_flag">
          <option>🇬🇧 +44</option><option>🇺🇸 +1</option><option>🇨🇦 +1</option>
          <option>🇦🇺 +61</option><option>🇮🇪 +353</option><option>🌐 +</option>
        </select>
        <input class="field-in" id="in_phone" type="tel" placeholder="Phone number" value="${answers.phone||''}" oninput="validContact()" style="flex:1;">
      </div>
      <br><button class="next" id="contactNext" onclick="submitContact()" disabled>Continue →</button>`;
  }

  stage.innerHTML = `<div class="panel">${inner}</div>`;
}

function pick(id, i){
  const item = questions.find(q=>q.id===id);
  const opt = item.options[i];
  answers[id] = typeof opt === 'string' ? opt : opt.label;
  const btns = stage.querySelectorAll('.opt');
  btns.forEach(b=>b.classList.remove('sel'));
  if(btns[i]) btns[i].classList.add('sel');
  setTimeout(()=>{ next(); }, 260);
}

function validText(id){
  const v = document.getElementById('in_'+id).value.trim();
  document.getElementById('textNext').disabled = v.length < 3;
}
function submitText(id){
  const v = document.getElementById('in_'+id).value.trim();
  if(v.length < 3) return;
  answers[id] = v;
  next();
}
function validEmail(){
  const v = document.getElementById('in_email').value.trim();
  const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  document.getElementById('emailNext').disabled = !ok;
  return ok;
}
function submitEmail(){
  if(!validEmail()) return;
  answers.email = document.getElementById('in_email').value.trim();
  next();
}
function validContact(){
  const f = document.getElementById('in_first').value.trim();
  const l = document.getElementById('in_last').value.trim();
  const p = document.getElementById('in_phone').value.trim();
  document.getElementById('contactNext').disabled = !(f && l && p.length>=6);
}
function submitContact(){
  answers.first = document.getElementById('in_first').value.trim();
  answers.last  = document.getElementById('in_last').value.trim();
  answers.phone = document.getElementById('in_flag').value + ' ' + document.getElementById('in_phone').value.trim();
  finish();
}

function finish(){
  const financeFail = FINANCE_DISQUALIFY.includes(answers.finance);
  routeEnd(financeFail ? 'dq' : 'ok');
}

function next(){ idx++; render(); }
function goBack(){ if(idx>0){ idx--; render(); } }
function restart(){ idx=0; render(); }

function routeEnd(route){
  idx = questions.length + 1;
  bar.style.width='100%';
  backBtn.classList.remove('show');
  restartBtn.style.display='block';

  if(route === 'ok'){
    stage.innerHTML = `
      <div class="panel end ok">
        <div class="mark">✓ Application received — you qualify</div>
        <h1>Let's lock in<br>your call.</h1>
        <p>You're on your way to transforming how you look, feel and perform. Pick a time below and come ready to talk honestly about where you're at and where you want to be.</p>
        <div id="cal-wrap" style="margin-top:22px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--bg-raise);"></div>
        <a class="bookbtn" href="${CALENDLY_URL}" target="_blank" rel="noopener">Open calendar in new tab →</a>
      </div>`;
    loadCalendly(document.getElementById('cal-wrap'));
  } else {
    stage.innerHTML = `
      <div class="panel end dq">
        <div class="mark">Application closed</div>
        <h1>Thanks for<br>applying.</h1>
        <p>Right now it doesn't look like the timing or resources are aligned for this program — and that's okay. We only take on people ready to fully commit, because that's what gets real results.</p>
        <p class="dim">If your situation changes, we'd love to hear from you again. In the meantime, follow JB Coaching Concepts for free training to keep building toward this.</p>
      </div>`;
  }
}

function loadCalendly(container){
  if(!container) return;
  container.innerHTML = '<div id="cal-embed" style="min-width:280px; height:640px;"></div>';
  const doInit = ()=>{
    if(window.Calendly && document.getElementById('cal-embed')){
      window.Calendly.initInlineWidget({
        url: CALENDLY_URL + '?hide_gdpr_banner=1&background_color=FFFFFF&text_color=16232B&primary_color=0E8C8B',
        parentElement: document.getElementById('cal-embed')
      });
    }
  };
  if(window.Calendly){ doInit(); return; }
  let s = document.getElementById('calendly-js');
  if(!s){
    s = document.createElement('script');
    s.id = 'calendly-js';
    s.src = 'https://assets.calendly.com/assets/external/widget.js';
    s.async = true;
    s.onload = doInit;
    document.body.appendChild(s);
  } else {
    s.addEventListener('load', doInit);
  }
}

document.addEventListener('keydown',(e)=>{
  if(idx>0 && idx<=questions.length){
    const item = questions[idx-1];
    if(item.type==='longtext' && (e.ctrlKey||e.metaKey) && e.key==='Enter'){
      submitText(item.id); return;
    }
    if(item.type==='choice'){
      const k = e.key.toUpperCase();
      const n = k.charCodeAt(0)-65;
      if(n>=0 && n<item.options.length){ pick(item.id, n); return; }
      const num = parseInt(e.key);
      if(num>=1 && num<=item.options.length){ pick(item.id, num-1); }
    }
  }
});

render();
</script>
</body>
</html>
